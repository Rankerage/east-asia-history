<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>강역도 편집기 — Territory Editor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#0d1117;color:#c9d1d9;display:flex;height:100vh}
#sidebar{width:320px;background:#161b22;border-right:1px solid #30363d;padding:16px;overflow-y:auto}
#sidebar h2{color:#d2991d;font-size:18px;margin-bottom:12px}
#sidebar label{display:block;font-size:12px;color:#8b949e;margin:8px 0 4px}
#sidebar select,#sidebar input,#sidebar textarea{width:100%;padding:6px 8px;border-radius:4px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;font-size:12px}
#sidebar textarea{height:120px;font-family:monospace;font-size:11px;resize:vertical}
#sidebar button{width:100%;padding:8px;margin-top:8px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;font-size:12px}
#sidebar button:hover{background:#30363d}
#sidebar button.primary{background:#238636;border-color:#238636;color:#fff}
#sidebar button.primary:hover{background:#2ea043}
#sidebar button.danger{background:#da3633;border-color:#da3633;color:#fff}
#map{flex:1}
.leaflet-container{background:#1a1f2e!important}
.leaflet-control-zoom a{background:#161b22!important;color:#c9d1d9!important;border-color:#30363d!important}
.info{font-size:10px;color:#8b949e;margin-top:8px;padding:8px;background:#0d1117;border-radius:4px}
</style>
</head>
<body>
<div id="sidebar">
  <h2>✏️ 강역도 편집기</h2>
  <label>시대 선택</label>
  <select id="eraSelect"></select>
  <label>영역 이름 (한글)</label>
  <input id="regionName" placeholder="예: 고구려 본토">
  <label>영역 이름 (English)</label>
  <input id="regionNameEn" placeholder="예: Goguryeo Core">
  <label>설명</label>
  <input id="regionDesc" placeholder="예: 5세기 전성기 강역">
  <label>색상</label>
  <input type="color" id="regionColor" value="#e74c3c">
  <label>투명도</label>
  <input type="range" id="regionOpacity" min="10" max="80" value="35">
  <button class="primary" onclick="downloadGeoJSON()">💾 GeoJSON 다운로드</button>
  <button onclick="loadGeoJSON()">📂 GeoJSON 불러오기</button>
  <button class="danger" onclick="clearAll()">🗑️ 모두 지우기</button>
  <div id="geoOutput" class="info" style="display:none"></div>
  <div class="info" style="margin-top:16px">
    <strong>사용법:</strong><br>
    1. 좌측 툴바에서 ✏️ 다각형 선택<br>
    2. 지도 클릭으로 영역 그리기<br>
    3. 더블클릭으로 완료<br>
    4. ✏️ 편집 툴로 수정<br>
    5. 🗑️ 툴로 개별 삭제<br>
    6. 우측 버튼으로 저장/불러오기
  </div>
  <input type="file" id="fileInput" accept=".json,.geojson" style="display:none" onchange="handleFile(this)">
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script>
var map, drawnItems, drawControl, eras=[];

fetch('data/eras.json').then(r=>r.json()).then(function(d){
  eras=d;
  var sel=document.getElementById('eraSelect');
  d.forEach(function(e,i){sel.innerHTML+='<option value="'+e.id+'">'+e.name_ko+' ('+e.name_en+')</option>';});
});

map=L.map('map',{center:[40,122],zoom:5,preferCanvas:true});
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:19
}).addTo(map);

drawnItems=new L.FeatureGroup();map.addLayer(drawnItems);
drawControl=new L.Control.Draw({
  draw:{polyline:false,rectangle:false,circle:false,circlemarker:false,marker:false},
  edit:{featureGroup:drawnItems,remove:true}
});
map.addControl(drawControl);

map.on(L.Draw.Event.CREATED,function(e){
  var layer=e.layer;
  var era=document.getElementById('eraSelect').value;
  layer.era=era;
  layer.properties={
    name_ko:document.getElementById('regionName').value||'영역',
    name_en:document.getElementById('regionNameEn').value||'Region',
    description:document.getElementById('regionDesc').value||'',
    color:document.getElementById('regionColor').value,
    opacity:parseInt(document.getElementById('regionOpacity').value)/100,
    era:era
  };
  layer.setStyle({fillColor:layer.properties.color,fillOpacity:layer.properties.opacity,color:layer.properties.color,weight:2});
  layer.bindTooltip(layer.properties.name_ko,{className:'era-tooltip',sticky:true});
  drawnItems.addLayer(layer);
});

function downloadGeoJSON(){
  var fc={type:'FeatureCollection',features:[]};
  drawnItems.eachLayer(function(l){
    var gj=l.toGeoJSON();
    gj.properties=l.properties||{};
    fc.features.push(gj);
  });
  var era=document.getElementById('eraSelect').value;
  var blob=new Blob([JSON.stringify(fc,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=era+'.json';a.click();
}

function loadGeoJSON(){document.getElementById('fileInput').click();}
function handleFile(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var data=JSON.parse(e.target.result);
    L.geoJSON(data,{onEachFeature:function(f,l){
      if(f.properties)l.properties=f.properties;
      l.setStyle({fillColor:(f.properties||{}).color||'#e74c3c',fillOpacity:(f.properties||{}).opacity||0.35,color:(f.properties||{}).color||'#e74c3c',weight:2});
      l.bindTooltip((f.properties||{}).name_ko||'영역');
      drawnItems.addLayer(l);
    }});
  };reader.readAsText(file);
}
function clearAll(){if(confirm('모든 영역을 삭제할까요?'))drawnItems.clearLayers();}
</script>
</body>
</html>
